# Updates the bundled Python.xcframework and PythonHeaders from a BeeWare
# Python-Apple-support release.  Run manually and provide the release tag
# (e.g. "3.13-b13") and the new CPython package version tag (e.g. "313.11.0").

name: Update xcframework

on:
  workflow_dispatch:
    inputs:
      beeware_tag:
        description: 'BeeWare Python-Apple-support tag (e.g. 3.13-b13)'
        required: true
        type: string
      release_tag:
        description: 'CPython package version tag (e.g. 313.11.0)'
        required: true
        type: string

jobs:
  update:
    name: Update xcframework from BeeWare
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download BeeWare tarballs
        run: |
          TAG="${{ github.event.inputs.beeware_tag }}"
          # Asset filenames use just the suffix after the dash, e.g. "3.13-b13" → "b13"
          SUFFIX="${TAG##*-}"
          BASE="https://github.com/beeware/Python-Apple-support/releases/download/$TAG"
          curl -L "$BASE/Python-3.13-macOS-support.$SUFFIX.tar.gz" -o macos.tar.gz
          curl -L "$BASE/Python-3.13-iOS-support.$SUFFIX.tar.gz"   -o ios.tar.gz

      - name: Extract tarballs
        run: |
          mkdir -p extract/macos extract/ios
          tar -xzf macos.tar.gz -C extract/macos
          tar -xzf ios.tar.gz   -C extract/ios

      - name: Rebuild multiplatform xcframework
        run: |
          MACOS_XC=$(find extract/macos -name "Python.xcframework" -maxdepth 2 | head -1)
          IOS_XC=$(find extract/ios   -name "Python.xcframework" -maxdepth 2 | head -1)
          echo "macOS xcframework: $MACOS_XC"
          echo "iOS   xcframework: $IOS_XC"

          # Copy the macOS slice into the iOS xcframework so it becomes multiplatform
          rm -rf Frameworks/Python.xcframework
          cp -R "$IOS_XC" Frameworks/Python.xcframework
          cp -R "$MACOS_XC/macos-arm64_x86_64" Frameworks/Python.xcframework/

          # Rebuild Info.plist to include the macOS slice entry
          python3 - <<'PYEOF'
          import plistlib, os, glob

          xc = "Frameworks/Python.xcframework"
          slices = []
          for d in sorted(os.listdir(xc)):
              if not os.path.isdir(os.path.join(xc, d)) or d.startswith('.'):
                  continue
              fw = glob.glob(os.path.join(xc, d, "*.framework"))
              if not fw:
                  continue
              fw = fw[0]
              fw_name = os.path.basename(fw)
              bundle_id = fw_name.replace(".framework", "")
              triples = d.replace("_", "-").split("-") if "_" in d else [d]
              # supported platforms from dir name
              parts = d.split("-")
              if "simulator" in d:
                  platform = parts[1] + "-simulator"
              else:
                  platform = parts[1] if len(parts) > 1 else parts[0]
              entry = {
                  "BinaryPath": f"{d}/{fw_name}/{bundle_id}",
                  "HeadersPath": f"{d}/{fw_name}/Headers",
                  "LibraryIdentifier": d,
                  "LibraryPath": f"{fw_name}",
                  "SupportedArchitectures": parts[0].split("_") if "_" in parts[0] else [parts[0]],
                  "SupportedPlatform": platform,
              }
              if "simulator" in d:
                  entry["SupportedPlatformVariant"] = "simulator"
              slices.append(entry)
          info = {"AvailableLibraries": slices, "CFBundlePackageType": "XFWK", "XCFrameworkFormatVersion": "1.0"}
          with open(os.path.join(xc, "Info.plist"), "wb") as f:
              plistlib.dump(info, f)
          print(f"Wrote Info.plist with {len(slices)} slices: {[s['LibraryIdentifier'] for s in slices]}")
          PYEOF

      - name: Update PythonHeaders from macOS slice
        run: |
          MACOS_HEADERS=$(find Frameworks/Python.xcframework/macos-arm64_x86_64 \
            -path "*/include/python3.13" -type d | head -1)
          echo "Copying headers from: $MACOS_HEADERS"
          rm -rf PythonHeaders
          mkdir -p PythonHeaders
          cp "$MACOS_HEADERS"/*.h PythonHeaders/

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Frameworks/Python.xcframework PythonHeaders/
          git commit -m "Update Python.xcframework and PythonHeaders to BeeWare ${{ github.event.inputs.beeware_tag }}"
          git tag ${{ github.event.inputs.release_tag }}
          git push origin HEAD
          git push origin ${{ github.event.inputs.release_tag }}

          allowUpdates: true
